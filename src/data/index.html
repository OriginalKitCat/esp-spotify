<!DOCTYPE html>
<html>
<head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Device Setup</title>
        <style>
        body { font: 18px Arial; max-width: 440px; margin: 40px auto;
                padding: 0 18px; background: #f3f5f7; color: #18202a; }
        main { background: white; padding: 24px; border-radius: 16px; }
        input { box-sizing: border-box; width: 100%; padding: 12px;
                margin: 8px 0 18px; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1769e0;
                color: white; border: 0; border-radius: 8px; font-size: 17px; }
        </style>
        </head>
        <body><main>
        <h2>Spotify Player Setup</h2>
        <p>Enter your Wifi Name & Password aswell as you Spotify credentials.</p>
        <form method="POST" action="/save">
        <label>Wifi Name</label>
        <input name="wifi_ssd" maxlength="48" required
                placeholder="Enter WiFi name">
        <label>Wifi Password</label>
        <input name="wifi_psw" maxlength="120" required
                placeholder="Enter Wifi Password">
        <label>Spotify Username</label>
        <input name="sptfy_usr_name" maxlength="120" required
                placeholder="Enter your Spotify Username">
        <label>Spotify Password</label>
        <input name="sptfy_psw" maxlength="120" required
                placeholder="Enter your Spotify Password">
        <button type="submit">Save configuration</button>
        </form>
</main></body></html>
